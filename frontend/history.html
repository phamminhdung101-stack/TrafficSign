<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử - AI Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold"><span class="text-blue-600">AI</span> Vision</span>
                    <div class="hidden md:ml-10 md:flex md:space-x-8">
                        <a href="upload.html" class="border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Nhận diện</a>
                        <a href="history.html" class="border-blue-500 text-slate-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Lịch sử</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Quản lý Lịch sử Nhận diện</h1>
                <p class="text-slate-500 mt-2">Xem lại các kết quả đã phân tích trước đây.</p>
            </div>
            <!-- Filter -->
            <div class="flex gap-2">
                <button onclick="loadHistory()" class="px-4 py-2 bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200 transition"><i class="fa-solid fa-rotate-right mr-1"></i> Tải lại</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-sm uppercase tracking-wider text-slate-500">
                            <th class="p-4 font-medium">Hình ảnh</th>
                            <th class="p-4 font-medium">Kết quả nhận diện</th>
                            <th class="p-4 font-medium">Độ chính xác cao nhất</th>
                            <th class="p-4 font-medium">Thời gian</th>
                            <th class="p-4 font-medium text-right">Loại nguồn</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody" class="divide-y divide-slate-200">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-500">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Đang tải dữ liệu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script>
        async function loadHistory() {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Đang tải dữ liệu...</td></tr>';
            
            const token = localStorage.getItem('access_token');
            if (!token) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-500">Vui lòng đăng nhập để xem lịch sử.</td></tr>';
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/api/history?limit=20&offset=0', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    tbody.innerHTML = '';
                    
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">Chưa có lịch sử nhận diện nào.</td></tr>';
                        return;
                    }

                    data.forEach(item => {
                        let bestResult = { code: 'Không nhận diện được', confidence: 0 };
                        if (item.results && item.results.length > 0) {
                            bestResult = item.results.reduce((prev, current) => (prev.confidence > current.confidence) ? prev : current);
                        }

                        const date = new Date(item.detected_at).toLocaleString('vi-VN');
                        const imgIcon = item.source_type === 'camera' ? 'fa-camera' : 'fa-image';

                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-50 transition">
                                <td class="p-4">
                                    <div class="w-16 h-12 bg-slate-100 rounded border flex items-center justify-center text-slate-400" title="${item.source_path}">
                                        <i class="fa-solid ${imgIcon} text-xl"></i>
                                    </div>
                                </td>
                                <td class="p-4 font-medium">${bestResult.code}</td>
                                <td class="p-4">${(bestResult.confidence * 100).toFixed(1)}%</td>
                                <td class="p-4 text-slate-500">${date}</td>
                                <td class="p-4 text-right">
                                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold uppercase">${item.source_type}</span>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    const err = await response.json();
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Lỗi: ${err.detail}</td></tr>`;
                }
            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-500">Lỗi kết nối đến máy chủ.</td></tr>';
            }
        }

        document.addEventListener("DOMContentLoaded", loadHistory);
    </script>
</body>
</html>

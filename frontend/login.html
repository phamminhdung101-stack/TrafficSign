<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AI Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
    <div class="glass-effect rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col transition-all duration-300">
        <div class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-800"><span class="text-blue-600">AI</span> Vision</h1>
                <p class="text-slate-500 mt-2">Đăng nhập để truy cập hệ thống nhận diện</p>
            </div>
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Tên đăng nhập / Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-envelope text-slate-400"></i>
                        </div>
                        <input id="username" type="text" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Tên đăng nhập" required>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-slate-700">Mật khẩu</label>
                        <a href="#" class="text-sm text-blue-600 hover:underline">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input id="password" type="password" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 flex justify-center items-center">
                    Đăng nhập <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
            <div class="mt-8 text-center">
                <p class="text-slate-600 text-sm">Chưa có tài khoản? <a href="register.html" class="text-blue-600 font-semibold hover:underline">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const btn = document.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang đăng nhập...';
            btn.disabled = true;

            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = 'upload.html';
                } else {
                    const error = await response.json();
                    let errorMsg = 'Vui lòng kiểm tra lại thông tin.';
                    if (error.detail) {
                        if (typeof error.detail === 'string') {
                            errorMsg = error.detail;
                        } else if (Array.isArray(error.detail)) {
                            errorMsg = error.detail.map(e => `${e.loc[e.loc.length-1]}: ${e.msg}`).join(', ');
                        } else {
                            errorMsg = JSON.stringify(error.detail);
                        }
                    }
                    alert('Đăng nhập thất bại: ' + errorMsg);
                }
            } catch (error) {
                console.error(error);
                alert('Lỗi kết nối đến máy chủ.');
            } finally {
                btn.innerHTML = 'Đăng nhập <i class="fa-solid fa-arrow-right ml-2"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Nhận diện - AI Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold"><span class="text-blue-600">AI</span> Vision</span>
                    <div class="hidden md:ml-10 md:flex md:space-x-8">
                        <a href="upload.html" class="border-blue-500 text-slate-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Nhận diện</a>
                        <a href="history.html" class="border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Lịch sử</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex justify-between items-end mb-8">
            <div>
                <a href="upload.html" class="text-blue-600 hover:underline mb-2 inline-block"><i class="fa-solid fa-arrow-left mr-1"></i> Quay lại</a>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Kết quả Nhận diện</h1>
            </div>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition flex items-center">
                <i class="fa-solid fa-download mr-2"></i> Tải ảnh xuống
            </button>
        </div>

        <div class="bg-white shadow-sm border border-slate-200 rounded-xl overflow-hidden p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Visual Result -->
            <div class="rounded-lg overflow-hidden border border-slate-200 bg-slate-100 flex items-center justify-center min-h-[300px] relative">
                <!-- Bounding Box Simulation -->
                <div class="absolute top-[20%] left-[30%] w-[40%] h-[50%] border-4 border-green-500 rounded bg-green-500/20 flex flex-col justify-end p-1">
                    <span class="bg-green-500 text-white text-xs font-bold px-1 rounded inline-block w-max">Tốc độ tối đa 50 98%</span>
                </div>
                <img src="https://images.unsplash.com/photo-1543083477-4f785aeafaa9?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Traffic Sign" class="w-full h-full object-cover">
            </div>

            <!-- Details -->
            <div class="flex flex-col justify-center space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-slate-500 uppercase tracking-wide">Đối tượng phát hiện</h3>
                    <div class="mt-2 p-4 bg-green-50 border border-green-200 rounded-lg">
                        <h2 class="text-2xl font-bold text-green-700">Biển báo Tốc độ tối đa 50</h2>
                        <p class="text-green-600 mt-1 flex items-center"><i class="fa-solid fa-check-circle mr-2"></i> Độ chính xác: 98.5%</p>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between py-2 border-b border-slate-100">
                        <span class="text-slate-500">Thời gian xử lý</span>
                        <span class="font-medium">1.2 giây</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-100">
                        <span class="text-slate-500">Model sử dụng</span>
                        <span class="font-medium">YOLOv8x - Custom</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-100">
                        <span class="text-slate-500">Độ phân giải ảnh</span>
                        <span class="font-medium">1920 x 1080</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
